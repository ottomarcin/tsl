<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e12'/%3E%3Cpath d='M4 17h6l3-7 5 13 3-6h7' fill='none' stroke='%235fbf8f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A scroll-driven 3D explanation of tumor lysis syndrome, from cell lysis to renal failure to intervention, for medical specialists and senior trainees." />
    <title>Tumor Lysis Syndrome — Clinical Visualization</title>
    <script>
      // Must mirror src/lib/theme.ts's resolveInitialTheme(). Runs before any
      // stylesheet/bundle loads so the first paint already matches the resolved
      // theme — no flash of the wrong theme on load.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
